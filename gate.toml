# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-arith"
tool_sha = "3779522887ace6426f8ba13fb0d55b625b781941"

[[check]]
name = "quality baseline ratchet"
argv = ["python3", "-B", "-I", "scripts/time_guard.py", "short", "--gate-check", "python3", "-I", "scripts/quality_metrics.py"]

[[check]]
name = "bounded default tests"
argv = ["python3", "-B", "-I", "scripts/time_guard.py", "moderate", "--gate-check", "scripts/test"]

[[check]]
name = "arith gate"
argv = ["python3", "-B", "-I", "scripts/time_guard.py", "eternal", "--gate-check", "scripts/gate"]

[[check]]
name = "circuits"
argv = ["python3", "-B", "-I", "scripts/time_guard.py", "eternal", "--gate-check", "tests/circuits/run"]

[siblings."bennett-isa-spec"]
sha = "62a0cf0ef9f1f1c1db12c84ed24846b6b9695cdc"
note = "ISA 0.9 K94 adjoint_table side conditions and reference checks; pushed main"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
# Builds precede the pushed-SHA checkout. Load the exact tracked profile/helper
# objects from arith's object database; never depend on live main file contents.
# Cache cwd: <arith>/.tmp/gate/cache/<pin>/<sibling>/reference-interpreter.
argv = ["python3", "-B", "-I", "-c", "import os,pathlib,subprocess; root=pathlib.Path.cwd().parents[5]; path=str(root/'scripts/machine_profile.py'); code=subprocess.check_output(['git','-C',str(root),'cat-file','blob',os.environ['BENNETT_GATE_PROFILE_HELPER']]); exec(compile(code,path,'exec'),dict(__name__='__main__',__file__=path))", "exec", "cargo", "cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { BENNETT_GATE_PROFILE_TABLE = "4549bd14c2d22cef057d3d21729e8ad323b9f52a", BENNETT_GATE_PROFILE_HELPER = "4d51dc036c4b3f5108d7d8278bdafdcd72fd8378" }

[siblings."bennett-dialect-spec"]
sha = "95a4b8d06933018a07fef3516296a25fd582fcde"
note = "Published 0.2.13: total PPC nearest-even tie parity"

